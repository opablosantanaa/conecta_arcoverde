spring:
  datasource:
    url: jdbc:mysql://localhost:3306/conecta_arcoverde?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=America/Recife
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:email@teste.com}
    password: ${MAIL_PASS:senha}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:umaChaveSuperSecretaEComplexaParaDesenvolvimentoLocalQueDeveSerTrocadaEmProducao123456}
  expiration: 86400000 # 24 horas

server:
  port: 8080
